quarkus.application.name=StockFlow API
quarkus.http.host=0.0.0.0
quarkus.http.port=${QUARKUS_HTTP_PORT:8080}

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5432/stockflow}
quarkus.datasource.username=${DB_USERNAME:stockflow}
quarkus.datasource.password=${DB_PASSWORD:stockflow_dev_password}

quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false

quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

quarkus.smallrye-openapi.info-title=StockFlow API
quarkus.smallrye-openapi.info-version=0.1.0
quarkus.smallrye-openapi.info-description=API do StockFlow SaaS.
quarkus.swagger-ui.always-include=true

quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type

stockflow.jwt.secret=${JWT_SECRET:change-this-secret-in-production}
stockflow.jwt.issuer=${JWT_ISSUER:stockflow}
stockflow.jwt.expires-in=${JWT_EXPIRES_IN:3600}

%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:stockflow_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=sa

%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.datasource.devservices.enabled=false

%test.quarkus.flyway.migrate-at-start=false
